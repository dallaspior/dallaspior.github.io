<!DOCTYPE html>
<!--[if lt IE 7]>      <html class="no-js lt-ie9 lt-ie8 lt-ie7"> <![endif]-->

<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Dallas Piorkowski</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            --color-primary: #5c3b42;
            --color-secondary: #3F5F23;
        }

        body {
            margin: 0;
            background-color: #D9DDDC;
            font-family: Georgia, Arial, Helvetica, sans-serif !important;
            padding-top: 70px;
            /* Prevent content from hiding behind navbar */
        }

        /* *** BootStrap Image override *** */
        /* Default image behavior */
        img#intro-image {
            width: 100%;
            height: auto;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25), 0 2px 4px rgba(0, 0, 0, 0.15);
        }

        /* When Bootstrap md breakpoint is reached */
        @media (max-width: 768px) {
            img#intro-image {
                width: 100%;
                max-width: 250px;
                aspect-ratio: 1 / 1;
                border-radius: 50% !important;
                object-fit: cover;
                border: 3px solid white;
                margin-bottom: 20px;
            }
        }

        section h1 {
            font-style: italic;
            text-align: center;
            color: var(--color-primary);
            margin: 0 0 2rem;
        }

        section>h1::before,
        section>h1::after {
            content: "";
            display: inline-block;
            width: 40px;
            height: 2px;
            background: var(--color-primary);
            vertical-align: middle;
            margin: 0 10px;
        }              
    </style>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="./#welcome">Home</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="./#prayer">Prayer</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./#donate">Donate</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./#connect">Connect</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./#story">Story</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./#partners">Partners</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">                
        <section class="my-5 row align-items-center donate" id="donate">
            <h1>Donate</h1>
            <div class="row g-3 justify-content-center">

                <!-- ZEFFY Form for Dallas fundraising through TLG -->                
                <div style="position:relative;overflow:hidden;height:630px;width:100%;"><iframe
                        title='Donation form powered by Zeffy'
                        style='position: absolute; border: 0; top:0;left:0;bottom:0;right:0;width:100%;height:100%'
                        src='https://www.zeffy.com/embed/donation-form/support-dallas-piorkowski' allowpaymentrequest
                        allowTransparency="true"></iframe></div>
                <div class="form-text text-center">*Donations submitted through the form above are eligible for tax
                    deduction. Donations will appear on your bank or credit statement under "Transform Lives Global."
                </div>                                            
            </div>    
        </section>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
